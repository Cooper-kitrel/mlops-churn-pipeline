# Five experiment configurations. Each entry overrides keys in config.yaml.
# Run all of them with:  python -m src.run_experiments
experiments:
  - name: logreg_baseline
    overrides:
      model.type: logistic_regression
      model.params: {C: 1.0, max_iter: 1000, class_weight: balanced}

  - name: logreg_strong_regularization
    overrides:
      model.type: logistic_regression
      model.params: {C: 0.05, max_iter: 1000, class_weight: balanced}

  - name: random_forest_200
    overrides:
      model.type: random_forest
      model.params: {n_estimators: 200, max_depth: 8, min_samples_leaf: 5, class_weight: balanced}

  - name: gradient_boosting_lr005
    overrides:
      model.type: gradient_boosting
      model.params: {n_estimators: 300, learning_rate: 0.05, max_depth: 3}

  - name: logreg_reduced_features
    # Different feature set: drop the streaming/protection add-on columns
    overrides:
      model.type: logistic_regression
      model.params: {C: 1.0, max_iter: 1000, class_weight: balanced}
      features.categorical: [gender, Partner, Dependents, PhoneService, InternetService,
                             Contract, PaperlessBilling, PaymentMethod, TechSupport]